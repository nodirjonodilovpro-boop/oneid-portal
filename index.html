<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneID — Davlat Raqamli Portali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=3">
  <script>
    try {
      var t = localStorage.getItem('oneid_theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* ignore */ }
  </script>
</head>
<body>
  <div class="demo-banner" role="note">
    <span class="ms sm">info</span>
    <span><b>O'quv / demo loyiha.</b> Bu haqiqiy davlat OneID tizimi emas — haqiqiy login, parol yoki shaxsiy ma'lumotlaringizni kiritmang. Rasmiy sayt: <a href="https://id.egov.uz" target="_blank" rel="noopener">id.egov.uz</a></span>
  </div>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=4"></script>
  <script src="i18n.js?v=3"></script>
  <script src="index.js?v=3"></script>
</body>
</html>
